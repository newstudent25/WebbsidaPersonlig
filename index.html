<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erik Selin</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #eeeeee;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }
    canvas { position: fixed; top: 0; left: 0; display: block; }

    /* Name in the corner, on top of the canvas */
    header {
      position: fixed;
      top: 1rem;
      left: 1.25rem;
      z-index: 2;
      font-size: 0.9rem;
      line-height: 1.3;
      pointer-events: none;
    }
    header h1 { margin: 0; font-size: 1rem; font-weight: 700; }
    header p  { margin: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Erik Selin</h1>
    <p>Student at Södertörn University</p>
  </header>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
  <script type="module">
// ─────────────────────────────────────────────────────────────
//  YOUR PROJECTS — add, remove or reorder entries here.
//  Each one becomes a clickable segment on the loop.
//    title: the text shown on the segment (short is better)
//    url:   where it links to (a page, a folder, or an outside link)
// ─────────────────────────────────────────────────────────────
const projects = [
  { title: "placeholder", url: "#" },
  { title: "project one", url: "project-one.html" },
  { title: "placeholder", url: "#" },
  { title: "placeholder", url: "#" },
  { title: "placeholder", url: "#" },
  { title: "placeholder", url: "#" },
  { title: "placeholder", url: "#" },
  { title: "placeholder", url: "#" },
  { title: "placeholder", url: "#" },
  { title: "placeholder", url: "#" },
  { title: "placeholder", url: "#" },
  { title: "placeholder", url: "#" },
  { title: "placeholder", url: "#" },
];

// ─────────────────────────────────────────────────────────────
//  Settings you can tweak
// ─────────────────────────────────────────────────────────────
const settings = {
  speed: 1,            // 0 = still, 1 = normal, 2 = twice as fast
  wobble: 0.16,        // how irregular the loop is
  maxFontSize: 18,     // upper limit for the label size
  redWidth: 26,        // thickness of the red loop
  boostSpeed: 8,       // speed multiplier while spacebar is held
  boostEase: 250,      // ms to ease up/down (higher = slower, smoother)
  imageUrl: null,      // e.g. "me.jpg" — leave null to show the grey placeholder
  imageWidth: 420,     // size of the centre box (in the 1200 x 700 drawing)
  imageHeight: 240,
  edgeBlur: 26,        // how soft the image edges are (0 = sharp)
};

const COLORS = { background: "#eeeeee", green: 0x357a1e, black: 0x000000, red: 0xe83323, white: 0xffffff };
const FONT = "Courier New, Courier, monospace";

// ─────────────────────────────────────────────────────────────
//  Below here is the engine — you shouldn't need to edit it
// ─────────────────────────────────────────────────────────────
const W = 1200, H = 700;   // the drawing is 1200 x 700 and scaled to fit the window
const TAU = Math.PI * 2;
const CTRL = 10;           // control points per loop
const STEPS = 40;          // samples between control points
const OVERLAP = 3;         // how far each band tucks under the next one
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const app = new PIXI.Application();
await app.init({
  resizeTo: window,
  background: COLORS.background,
  antialias: true,
  resolution: devicePixelRatio || 1,
  autoDensity: true,
});
document.body.appendChild(app.canvas);

const world = new PIXI.Container();
app.stage.addChild(world);

// ── Loop geometry ──

// A wobbly closed shape: control points around an ellipse, pushed in/out by slow waves
function controlPoints(t, cx, cy, rx, ry, seed) {
  return Array.from({ length: CTRL }, (_, i) => {
    const a = (i / CTRL) * TAU;
    const f = 1 + settings.wobble * (
      0.6 * Math.sin(a * 2 + seed + t * 0.00031) +
      0.4 * Math.sin(a * 3 - seed * 1.3 + t * 0.00047)
    );
    return [cx + rx * f * Math.cos(a), cy + ry * f * Math.sin(a)];
  });
}

// One coordinate of a Catmull-Rom spline
const spline = (a, b, c, d, u) =>
  0.5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u * u + (-a + 3 * b - 3 * c + d) * u * u * u);

// Smooth closed curve through the control points
function smooth(ctrl) {
  const n = ctrl.length, out = [];
  for (let i = 0; i < n; i++) {
    const [p0, p1, p2, p3] = [-1, 0, 1, 2].map((o) => ctrl[(i + o + n) % n]);
    for (let k = 0; k < STEPS; k++) {
      const u = k / STEPS;
      out.push([spline(p0[0], p1[0], p2[0], p3[0], u), spline(p0[1], p1[1], p2[1], p3[1], u)]);
    }
  }
  out.push(out[0]); // close the loop
  return out;
}

const mainLoop = (t) => smooth(controlPoints(t, 600, 350, 430, 250, 0));
const redLoop  = (t) => smooth(controlPoints(t, 640, 360, 470, 270, 2.1));

// Running distance along the loop at each point
function cumulative(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) {
    cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  }
  return cum;
}

// Point (and direction) at a given distance along the loop
function pointAt(pts, cum, d) {
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (cum[mid] < d) lo = mid; else hi = mid;
  }
  const k = Math.min(1, Math.max(0, (d - cum[lo]) / (cum[hi] - cum[lo] || 1)));
  // direction from a slightly wider window, so letters turn smoothly
  const a = pts[Math.max(0, lo - 2)], b = pts[Math.min(pts.length - 1, hi + 2)];
  return {
    x: pts[lo][0] + (pts[hi][0] - pts[lo][0]) * k,
    y: pts[lo][1] + (pts[hi][1] - pts[lo][1]) * k,
    angle: Math.atan2(b[1] - a[1], b[0] - a[0]),
  };
}

// ── Centre image (placeholder) with soft edges ──
// The picture is faded out with a blurred alpha mask, so its edges dissolve
// smoothly into whatever is behind it (works with any background colour).
{
  const cx = 600, cy = 350;
  const w = settings.imageWidth, h = settings.imageHeight;
  const x = cx - w / 2, y = cy - h / 2;

  const photo = new PIXI.Container();
  const content = new PIXI.Container();
  photo.addChild(content);
  world.addChild(photo);

  // Grey placeholder (hidden once a real image loads)
  const placeholder = new PIXI.Container();
  const label = new PIXI.Text({
    text: "image",
    style: { fontFamily: FONT, fontSize: 16, fill: 0x777777 },
    resolution: 4,
  });
  label.anchor.set(0.5);
  label.position.set(cx, cy);
  placeholder.addChild(new PIXI.Graphics().rect(x, y, w, h).fill(0xbdbdbd), label);
  content.addChild(placeholder);

  // Swap in a real image when settings.imageUrl is set (cropped to fill the box)
  if (settings.imageUrl) {
    PIXI.Assets.load(settings.imageUrl).then((tex) => {
      const sprite = new PIXI.Sprite(tex);
      sprite.anchor.set(0.5);
      sprite.position.set(cx, cy);
      sprite.scale.set(Math.max(w / tex.width, h / tex.height));
      // keep it inside the box so it can't spill past the faded edge
      const crop = new PIXI.Graphics().rect(x, y, w, h).fill(0xffffff);
      sprite.mask = crop;
      content.addChild(crop, sprite);
      placeholder.visible = false;
    });
  }

  if (settings.edgeBlur > 0) {
    // Soft mask, built once: a white rectangle pulled in from the edges, then blurred
    const e = settings.edgeBlur, pad = e * 3;
    const frame = new PIXI.Rectangle(x - pad, y - pad, w + pad * 2, h + pad * 2);
    const src = new PIXI.Container();
    src.addChild(
      new PIXI.Graphics().rect(frame.x, frame.y, frame.width, frame.height).fill({ color: 0x000000, alpha: 0 }),
      new PIXI.Graphics().rect(x + e, y + e, w - e * 2, h - e * 2).fill(0xffffff),
    );
    src.filters = [new PIXI.BlurFilter({ strength: e * 0.7, quality: 6 })];

    const maskSprite = new PIXI.Sprite(app.renderer.generateTexture({ target: src, frame, resolution: 1 }));
    maskSprite.position.set(frame.x, frame.y);
    photo.addChild(maskSprite);
    content.mask = maskSprite;
  }
}

// ── Build the scene ──

const redG = new PIXI.Graphics();
world.addChild(redG);

// Size the labels once, from the loop's length
const weights = projects.map((p) => p.title.length + 2);
const weightSum = weights.reduce((a, b) => a + b, 0);
const firstTotal = cumulative(mainLoop(0)).at(-1);
const fontSize = Math.max(11, Math.min(settings.maxFontSize, (firstTotal / weightSum) * 1.5));
const bandWidth = fontSize * 1.3;
const charWidth = fontSize * 0.6;   // monospace letters are 0.6 em wide

const segments = projects.map((p, i) => {
  const g = new PIXI.Graphics();
  g.eventMode = "static";
  g.cursor = "pointer";
  world.addChild(g);

  const base = i % 2 === 0 ? COLORS.green : COLORS.black;
  const idleText = base === COLORS.black ? COLORS.white : COLORS.black;
  const seg = { g, base, hover: false, chars: [] };

  for (const ch of p.title) {
    const t = new PIXI.Text({ text: ch, style: { fontFamily: FONT, fontSize, fill: idleText }, resolution: 4 });
    t.anchor.set(0.5);
    t.eventMode = "none";
    t.visible = ch !== " ";
    world.addChild(t);
    seg.chars.push(t);
  }

  const setHover = (on) => {
    seg.hover = on;
    seg.chars.forEach((t) => { t.style.fill = on ? COLORS.white : idleText; });
  };
  g.on("pointerover", () => setHover(true));
  g.on("pointerout", () => setHover(false));
  g.on("pointertap", () => { location.href = p.url; });
  return seg;
});

// ── Draw every frame ──

function draw(time) {
  // Scale the 1200 x 700 drawing to fit the window, centred
  const s = Math.min(app.screen.width / W, app.screen.height / H);
  world.scale.set(s);
  world.position.set((app.screen.width - W * s) / 2, (app.screen.height - H * s) / 2);

  // Red loop (behind)
  redG.clear().poly(redLoop(time).flat()).stroke({ width: settings.redWidth, color: COLORS.red, join: "round" });

  // Main loop
  const pts = mainLoop(time);
  const cum = cumulative(pts);
  const total = cum.at(-1);

  let acc = 0;
  segments.forEach((seg, i) => {
    const start = (acc / weightSum) * total;
    acc += weights[i];
    const end = (acc / weightSum) * total;

    // The coloured band: a stretch of the loop, running a hair past its end so it
    // overlaps the next band (no gap at the join). The last one wraps round to the first.
    const first = pointAt(pts, cum, start);
    seg.g.clear().moveTo(first.x, first.y);
    pts.forEach((p, k) => { if (cum[k] > start && cum[k] < end) seg.g.lineTo(p[0], p[1]); });
    const last = pointAt(pts, cum, end);
    const over = pointAt(pts, cum, (end + OVERLAP) % total);
    seg.g.lineTo(last.x, last.y).lineTo(over.x, over.y);
    seg.g.stroke({ width: bandWidth, color: seg.hover ? COLORS.red : seg.base, cap: "butt", join: "round" });

    // Is this label heading leftwards (upside down)? If so, write it the other way round.
    // The two thresholds stop a label from flip-flopping while it sits near vertical.
    const lean = Math.cos(pointAt(pts, cum, (start + end) / 2).angle);
    if (seg.flipped === undefined) seg.flipped = lean < 0;
    else if (!seg.flipped && lean < -0.2) seg.flipped = true;
    else if (seg.flipped && lean > 0.2) seg.flipped = false;

    // The letters: centred on the band, one by one
    const n = seg.chars.length;
    const from = start + (end - start - n * charWidth) / 2;
    seg.chars.forEach((t, j) => {
      const slot = seg.flipped ? n - 1 - j : j;   // reversed order when flipped
      const p = pointAt(pts, cum, from + (slot + 0.5) * charWidth);
      t.position.set(p.x, p.y);
      t.rotation = seg.flipped ? p.angle + Math.PI : p.angle;
    });
  });
}

// ── Spacebar boost: hold space to speed the loop up, release to ease back ──
let boost = 1, boostTarget = 1;
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); boostTarget = settings.boostSpeed; }
});
addEventListener("keyup", (e) => { if (e.code === "Space") boostTarget = 1; });
addEventListener("blur", () => { boostTarget = 1; });   // don't get stuck fast if focus is lost

let time = 0;
app.ticker.add(({ deltaMS }) => {
  // Ease the multiplier toward its target (frame-rate independent)
  boost += (boostTarget - boost) * (1 - Math.exp(-deltaMS / settings.boostEase));
  if (!reduceMotion) time += deltaMS * settings.speed * boost;
  draw(time);
});
  </script>
</body>
</html>
